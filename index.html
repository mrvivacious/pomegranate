<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomegranate Shipment Tracker</title>
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    /* ── THEME VARIABLES ── */
    :root {
      --bg:            #FAF3EE;
      --bg-card:       #FFFFFF;
      --bg-nav:        #7A1530;
      --nav-text:      #FAE8EC;
      --text:          #1E0A10;
      --text-muted:    #6B3040;
      --accent:        #8B1A35;
      --accent-hover:  #A82040;
      --border:        rgba(139,26,53,0.18);
      --shadow:        0 2px 12px rgba(139,26,53,0.10);
      --badge-nd-bg:   #FFF3CD;
      --badge-nd-text: #7A5200;
      --badge-it-bg:   #DBEAFE;
      --badge-it-text: #1E40AF;
      --badge-del-bg:  #DCFCE7;
      --badge-del-text:#166534;
      --modal-bg:      rgba(0,0,0,0.45);
      --input-bg:      #FFF8F5;
      --input-border:  rgba(139,26,53,0.3);
    }

    [data-theme="dark"] {
      --bg:            #110508;
      --bg-card:       #1C0B10;
      --bg-nav:        #120408;
      --nav-text:      #F5D5DC;
      --text:          #F0DDE2;
      --text-muted:    #C09AA4;
      --accent:        #C94060;
      --accent-hover:  #E05575;
      --border:        rgba(201,64,96,0.22);
      --shadow:        0 2px 14px rgba(0,0,0,0.45);
      --badge-nd-bg:   #3D2A00;
      --badge-nd-text: #FCD57A;
      --badge-it-bg:   #0D2340;
      --badge-it-text: #93C5FD;
      --badge-del-bg:  #0A2818;
      --badge-del-text:#86EFAC;
      --modal-bg:      rgba(0,0,0,0.7);
      --input-bg:      #200C12;
      --input-border:  rgba(201,64,96,0.4);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: 60px;
      transition: background 0.25s, color 0.25s;
    }

    /* ── NAVBAR ── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: var(--bg-nav);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--nav-text);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .navbar-brand .icon { font-size: 1.4rem; }

    .btn-theme {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: var(--nav-text);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn-theme:hover { background: rgba(255,255,255,0.24); }

    /* ── MAIN ── */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title    { font-size: 1.55rem; font-weight: 700; }
    .page-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-top: 4px; }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .btn-add:hover { background: var(--accent-hover); transform: translateY(-1px); }

    /* ── STATS ── */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.82rem;
      color: var(--text-muted);
      box-shadow: var(--shadow);
      min-width: 90px;
    }

    .stat-chip strong {
      display: block;
      font-size: 1.5rem;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 2px;
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 14px; display: block; }
    .empty-state p { font-size: 1rem; }

    /* ── CARD ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: box-shadow 0.2s;
    }

    .card:hover { box-shadow: 0 4px 22px rgba(139,26,53,0.16); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-name { font-size: 1rem; font-weight: 700; line-height: 1.3; }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .badge-nd  { background: var(--badge-nd-bg);  color: var(--badge-nd-text); }
    .badge-it  { background: var(--badge-it-bg);  color: var(--badge-it-text); }
    .badge-del { background: var(--badge-del-bg); color: var(--badge-del-text); }

    .card-route {
      font-size: 0.86rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-route .arrow { color: var(--accent); font-size: 1rem; }

    .card-detail { display: flex; flex-direction: column; gap: 7px; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.84rem;
      gap: 8px;
    }

    .detail-label { color: var(--text-muted); flex-shrink: 0; }
    .detail-value { font-weight: 600; text-align: right; }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .btn-sm {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }

    .btn-sm:hover { background: var(--bg); color: var(--text); }

    .btn-docs {
      background: var(--accent);
      color: #fff !important;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-docs:hover { background: var(--accent-hover) !important; border-color: var(--accent-hover); }

    .btn-delete { color: #B91C1C; border-color: rgba(185,28,28,0.25); }
    .btn-delete:hover { background: rgba(185,28,28,0.08) !important; color: #B91C1C !important; }

    /* ── MODAL ── */
    dialog {
      border: none;
      border-radius: 14px;
      padding: 0;
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      max-width: 520px;
      width: calc(100vw - 48px);
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }

    dialog::backdrop { background: var(--modal-bg); }

    .modal-header {
      position: sticky;
      top: 0;
      padding: 20px 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    .modal-title { font-size: 1.05rem; font-weight: 700; }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .btn-close:hover { color: var(--text); }

    .modal-body { padding: 20px 24px 4px; }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }

    .form-group textarea { resize: vertical; min-height: 72px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .form-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 20px 0 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .modal-footer {
      position: sticky;
      bottom: 0;
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 20px;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text-muted);
      font-family: inherit;
    }

    .btn-cancel:hover { background: var(--bg); }

    .btn-submit {
      background: var(--accent);
      border: none;
      border-radius: 7px;
      padding: 9px 24px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit:hover { background: var(--accent-hover); }

    /* ── DOCUMENT OVERLAY ── */
    #doc-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #DDD6CE;
      overflow-y: auto;
      padding: 28px 16px;
    }

    #doc-overlay.open { display: block; }

    .doc-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .btn-print {
      background: #1B6B22;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 26px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-print:hover { background: #267A2E; }

    .btn-close-doc {
      background: #555;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 26px;
      font-size: 0.92rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-close-doc:hover { background: #333; }

    /* ── DOCUMENT PAGES ── */
    .doc-page {
      background: #fff;
      color: #111;
      max-width: 794px;
      margin: 0 auto 36px;
      padding: 52px 64px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.18);
      font-family: 'Times New Roman', Times, serif;
      font-size: 11.5pt;
      line-height: 1.55;
    }

    .doc-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 3px double #333;
    }

    .doc-title {
      font-size: 19pt;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .doc-ref { text-align: right; font-size: 10pt; line-height: 1.8; }
    .doc-ref strong { display: block; font-size: 8.5pt; text-transform: uppercase; letter-spacing: 0.06em; color: #666; }

    .doc-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid #999;
      margin-bottom: 20px;
    }

    .doc-party {
      padding: 14px 16px;
    }

    .doc-party + .doc-party { border-left: 1px solid #999; }

    .doc-party h3 {
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 7px;
      padding-bottom: 4px;
      border-bottom: 1px solid #ddd;
      font-family: Arial, sans-serif;
    }

    .doc-party p { font-size: 10.5pt; line-height: 1.75; }

    .placeholder { color: #999; font-style: italic; }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 10pt;
      font-family: Arial, sans-serif;
    }

    .doc-table th {
      background: #F0F0F0;
      border: 1px solid #999;
      padding: 7px 12px;
      text-align: left;
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .doc-table td { border: 1px solid #999; padding: 8px 12px; }

    .doc-table .total-row td { font-weight: bold; background: #F8F8F8; }

    .doc-fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid #999;
      margin-bottom: 20px;
    }

    .doc-field { padding: 12px 16px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; }
    .doc-field:nth-child(even) { border-right: none; }
    .doc-field:nth-last-child(-n+2) { border-bottom: none; }

    .doc-field h3 {
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      margin-bottom: 4px;
      font-family: Arial, sans-serif;
    }

    .doc-field p { font-size: 10.5pt; }

    .doc-section { margin-bottom: 18px; }

    .doc-section h3 {
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid #ddd;
      font-family: Arial, sans-serif;
    }

    .doc-section p { font-size: 10.5pt; line-height: 1.75; }

    .doc-footer {
      margin-top: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      border-top: 1px solid #aaa;
      padding-top: 16px;
      font-size: 9.5pt;
      font-family: Arial, sans-serif;
    }

    .sig-box p { color: #444; margin-bottom: 36px; }
    .sig-line { border-top: 1px solid #333; padding-top: 4px; font-size: 8.5pt; color: #666; }

    /* ── PRINT ── */
    @media print {
      .doc-controls { display: none !important; }
      #doc-overlay { background: #fff; padding: 0; }

      .doc-page {
        box-shadow: none;
        margin: 0;
        padding: 18mm 22mm;
        max-width: none;
        page-break-after: always;
      }

      .doc-page:last-child { page-break-after: auto; }

      body > *:not(#doc-overlay) { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="icon">🍎</span>
      Pomegranate Tracker
    </div>
    <button class="btn-theme" id="theme-btn">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Dark</span>
    </button>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Shipment Dashboard</div>
        <div class="page-subtitle">Track and manage all pomegranate shipments</div>
      </div>
      <button class="btn-add" id="add-btn">＋ Add Shipment</button>
    </div>

    <div class="stats-row" id="stats-row"></div>
    <div class="grid" id="grid"></div>
  </main>

  <!-- ADD SHIPMENT DIALOG -->
  <dialog id="add-dialog">
    <div class="modal-header">
      <span class="modal-title">Add Shipment</span>
      <button class="btn-close" id="dialog-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <form id="shipment-form" novalidate>

        <div class="form-group">
          <label for="f-name">Shipment Name *</label>
          <input type="text" id="f-name" placeholder="e.g. Spring Batch #1" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-amount">Amount (kg) *</label>
            <input type="number" id="f-amount" min="1" placeholder="e.g. 2000" />
          </div>
          <div class="form-group">
            <label for="f-price">Unit Price ($/kg)</label>
            <input type="number" id="f-price" min="0" step="0.01" placeholder="e.g. 3.50" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-source">Source / Port of Loading *</label>
            <input type="text" id="f-source" placeholder="e.g. Bandar Abbas Port" />
          </div>
          <div class="form-group">
            <label for="f-dest">Destination / Port of Discharge *</label>
            <input type="text" id="f-dest" placeholder="e.g. Rotterdam Port" />
          </div>
        </div>

        <div class="form-group">
          <label for="f-location">Current Location / Port *</label>
          <input type="text" id="f-location" placeholder="e.g. Suez Canal" />
        </div>

        <div class="form-group">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="not-departed">Not Yet Departed</option>
            <option value="in-transit">In Transit</option>
            <option value="delivered">Delivered</option>
          </select>
        </div>

        <div class="form-section-label">Consignee / Buyer Details (for invoice &amp; B/L)</div>

        <div class="form-group">
          <label for="f-consignee-name">Consignee Name</label>
          <input type="text" id="f-consignee-name" placeholder="e.g. Rotterdam Fresh Imports B.V." />
        </div>

        <div class="form-group">
          <label for="f-consignee-addr">Consignee Address</label>
          <textarea id="f-consignee-addr" placeholder="e.g. Wilhelminakade 123&#10;3072 AP Rotterdam&#10;Netherlands"></textarea>
        </div>

      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="dialog-cancel">Cancel</button>
      <button class="btn-submit" id="dialog-submit">Add Shipment</button>
    </div>
  </dialog>

  <!-- DOCUMENT OVERLAY -->
  <div id="doc-overlay">
    <div class="doc-controls">
      <button class="btn-print" onclick="window.print()">🖨 Print / Save as PDF</button>
      <button class="btn-close-doc" onclick="closeDocOverlay()">✕ Close</button>
    </div>
    <div id="doc-content"></div>
  </div>

  <script>
    // ── STORAGE ──
    const STORAGE_KEY = 'pom_shipments';

    function load()        { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
    function persist(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    function uid()         { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    // ── DEMO DATA (inserted only on first visit) ──
    const DEMO = [
      {
        id: 'demo1', name: 'Spring Harvest Batch A',
        amount: 4500, unitPrice: 3.20,
        source: 'Bandar Abbas Port', destination: 'Rotterdam Port',
        currentLocation: 'Suez Canal (northbound)',
        status: 'in-transit',
        consigneeName: 'Rotterdam Fresh Imports B.V.',
        consigneeAddress: 'Wilhelminakade 123\n3072 AP Rotterdam\nNetherlands',
        createdAt: new Date().toISOString()
      },
      {
        id: 'demo2', name: 'Express Order #7',
        amount: 1200, unitPrice: 3.80,
        source: 'Jaffa Port', destination: 'Hamburg Port',
        currentLocation: 'Jaffa Port — awaiting customs clearance',
        status: 'not-departed',
        consigneeName: 'Hamburg Fruit GmbH',
        consigneeAddress: 'Speicherstadt 45\n20457 Hamburg\nGermany',
        createdAt: new Date().toISOString()
      },
      {
        id: 'demo3', name: 'Winter Reserve B',
        amount: 6000, unitPrice: 2.90,
        source: 'Aqaba Port', destination: 'Barcelona Port',
        currentLocation: 'Barcelona Port — delivered to warehouse',
        status: 'delivered',
        consigneeName: 'Mercado Central S.A.',
        consigneeAddress: 'Calle Mercat 8\n08002 Barcelona\nSpain',
        createdAt: new Date().toISOString()
      }
    ];

    // ── STATE ──
    let shipments = load();
    if (shipments.length === 0) { shipments = DEMO; persist(shipments); }

    // ── HELPERS ──
    function esc(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function nlToBr(str) { return esc(str).replace(/\n/g, '<br>'); }

    function fmtAmt(n)   { return Number(n).toLocaleString() + ' kg'; }
    function fmtMoney(n) { return '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
    function todayStr()  { return new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'}); }

    function statusMeta(s) {
      if (s === 'not-departed') return { cls: 'badge-nd',  label: 'Not Yet Departed' };
      if (s === 'in-transit')   return { cls: 'badge-it',  label: 'In Transit' };
      return                           { cls: 'badge-del', label: 'Delivered' };
    }

    // ── RENDER ──
    function renderStats() {
      const total     = shipments.length;
      const nd        = shipments.filter(s => s.status === 'not-departed').length;
      const transit   = shipments.filter(s => s.status === 'in-transit').length;
      const delivered = shipments.filter(s => s.status === 'delivered').length;
      document.getElementById('stats-row').innerHTML =
        `<div class="stat-chip"><strong>${total}</strong>Total</div>` +
        `<div class="stat-chip"><strong>${nd}</strong>Not Yet Departed</div>` +
        `<div class="stat-chip"><strong>${transit}</strong>In Transit</div>` +
        `<div class="stat-chip"><strong>${delivered}</strong>Delivered</div>`;
    }

    function renderCards() {
      const grid = document.getElementById('grid');
      if (shipments.length === 0) {
        grid.innerHTML = `<div class="empty-state"><span class="icon">🍎</span><p>No shipments yet. Click <strong>Add Shipment</strong> to get started.</p></div>`;
        renderStats();
        return;
      }
      grid.innerHTML = shipments.map(s => {
        const m = statusMeta(s.status);
        const docsBtn = s.status === 'delivered'
          ? `<button class="btn-sm btn-docs" onclick="openDocs('${s.id}')">📄 Generate Documents</button>`
          : '';
        const priceRow = s.unitPrice
          ? `<div class="detail-row"><span class="detail-label">Unit Price</span><span class="detail-value">${fmtMoney(s.unitPrice)}/kg</span></div>`
          : '';
        const consigneeRow = s.consigneeName
          ? `<div class="detail-row"><span class="detail-label">Consignee</span><span class="detail-value">${esc(s.consigneeName)}</span></div>`
          : '';
        return `
          <div class="card">
            <div class="card-header">
              <div class="card-name">${esc(s.name)}</div>
              <span class="badge ${m.cls}">${m.label}</span>
            </div>
            <div class="card-route">
              <span>${esc(s.source)}</span>
              <span class="arrow">→</span>
              <span>${esc(s.destination)}</span>
            </div>
            <div class="card-detail">
              <div class="detail-row">
                <span class="detail-label">Amount</span>
                <span class="detail-value">${fmtAmt(s.amount)}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Current Location</span>
                <span class="detail-value">${esc(s.currentLocation)}</span>
              </div>
              ${priceRow}
              ${consigneeRow}
            </div>
            <div class="card-actions">
              ${docsBtn}
              <button class="btn-sm btn-delete" onclick="deleteShipment('${s.id}')">Delete</button>
            </div>
          </div>`;
      }).join('');
      renderStats();
    }

    // ── ADD SHIPMENT ──
    const dialog = document.getElementById('add-dialog');

    document.getElementById('add-btn').addEventListener('click', () => dialog.showModal());
    document.getElementById('dialog-close').addEventListener('click', () => dialog.close());
    document.getElementById('dialog-cancel').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

    document.getElementById('dialog-submit').addEventListener('click', () => {
      const name     = document.getElementById('f-name').value.trim();
      const amount   = parseFloat(document.getElementById('f-amount').value);
      const price    = parseFloat(document.getElementById('f-price').value) || 0;
      const source   = document.getElementById('f-source').value.trim();
      const dest     = document.getElementById('f-dest').value.trim();
      const location = document.getElementById('f-location').value.trim();
      const status   = document.getElementById('f-status').value;
      const cName    = document.getElementById('f-consignee-name').value.trim();
      const cAddr    = document.getElementById('f-consignee-addr').value.trim();

      if (!name || !amount || amount <= 0 || !source || !dest || !location) {
        alert('Please fill in all required fields (marked with *).');
        return;
      }

      shipments.unshift({
        id: uid(), name, amount, unitPrice: price,
        source, destination: dest, currentLocation: location, status,
        consigneeName: cName, consigneeAddress: cAddr,
        createdAt: new Date().toISOString()
      });
      persist(shipments);
      renderCards();
      dialog.close();
      document.getElementById('shipment-form').reset();
    });

    // ── DELETE ──
    function deleteShipment(id) {
      if (!confirm('Delete this shipment? This cannot be undone.')) return;
      shipments = shipments.filter(s => s.id !== id);
      persist(shipments);
      renderCards();
    }

    // ── DOCUMENT GENERATION ──
    function docNo(prefix, id) {
      // Use a stable index based on position among all delivered shipments
      const delivered = shipments.filter(s => s.status === 'delivered');
      const idx = delivered.findIndex(s => s.id === id);
      return prefix + '-' + String(idx + 1).padStart(4, '0');
    }

    function openDocs(id) {
      const s = shipments.find(sh => sh.id === id);
      if (!s) return;

      const invNo  = docNo('INV', id);
      const blNo   = docNo('BL',  id);
      const total  = s.amount * s.unitPrice;
      const today  = todayStr();

      const sellerHtml = `
        <span class="placeholder">[Your Company Name]</span><br>
        <span class="placeholder">[Street Address]</span><br>
        <span class="placeholder">[City, Country]</span>`;

      const consigneeHtml = s.consigneeName
        ? `${esc(s.consigneeName)}<br>${nlToBr(s.consigneeAddress || '')}`
        : `<span class="placeholder">[Consignee Name &amp; Address]</span>`;

      const invoice = `
        <div class="doc-page">
          <div class="doc-header-bar">
            <div class="doc-title">Commercial Invoice</div>
            <div class="doc-ref">
              <strong>Invoice No.</strong>${invNo}
              <strong>Date</strong>${today}
              <strong>Shipment Ref.</strong>${esc(s.name)}
            </div>
          </div>

          <div class="doc-parties">
            <div class="doc-party">
              <h3>Seller / Shipper</h3>
              <p>${sellerHtml}</p>
            </div>
            <div class="doc-party">
              <h3>Buyer / Consignee</h3>
              <p>${consigneeHtml}</p>
            </div>
          </div>

          <table class="doc-table">
            <thead>
              <tr>
                <th>Description of Goods</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Fresh Pomegranates</td>
                <td>${Number(s.amount).toLocaleString()} kg</td>
                <td>${s.unitPrice ? fmtMoney(s.unitPrice) + ' / kg' : '<span class="placeholder">—</span>'}</td>
                <td>${s.unitPrice ? fmtMoney(total) : '<span class="placeholder">[Amount]</span>'}</td>
              </tr>
              <tr class="total-row">
                <td colspan="3" style="text-align:right; padding-right:16px;">Total Amount Due</td>
                <td>${s.unitPrice ? fmtMoney(total) : '<span class="placeholder">[Amount]</span>'}</td>
              </tr>
            </tbody>
          </table>

          <div class="doc-section">
            <h3>Port of Loading</h3>
            <p>${esc(s.source)}</p>
          </div>
          <div class="doc-section">
            <h3>Port of Discharge</h3>
            <p>${esc(s.destination)}</p>
          </div>

          <div class="doc-section">
            <h3>Payment Instructions (for bank collection)</h3>
            <p>
              Bank: <span class="placeholder">[Bank Name]</span><br>
              Account No.: <span class="placeholder">[Account Number]</span><br>
              SWIFT / BIC: <span class="placeholder">[SWIFT Code]</span><br>
              IBAN: <span class="placeholder">[IBAN]</span><br>
              Reference: ${invNo}
            </p>
          </div>

          <div class="doc-footer">
            <div class="sig-box">
              <p>Authorised Signature &amp; Company Stamp</p>
              <div class="sig-line">Seller / Shipper</div>
            </div>
            <div class="sig-box">
              <p>Received By</p>
              <div class="sig-line">Buyer / Consignee</div>
            </div>
          </div>
        </div>`;

      const bl = `
        <div class="doc-page">
          <div class="doc-header-bar">
            <div class="doc-title">Bill of Lading</div>
            <div class="doc-ref">
              <strong>B/L No.</strong>${blNo}
              <strong>Date</strong>${today}
              <strong>Shipment Ref.</strong>${esc(s.name)}
            </div>
          </div>

          <div class="doc-parties">
            <div class="doc-party">
              <h3>Shipper / Exporter</h3>
              <p>${sellerHtml}</p>
            </div>
            <div class="doc-party">
              <h3>Consignee</h3>
              <p>${consigneeHtml}</p>
            </div>
          </div>

          <div class="doc-fields-grid">
            <div class="doc-field"><h3>Port of Loading</h3><p>${esc(s.source)}</p></div>
            <div class="doc-field"><h3>Port of Discharge</h3><p>${esc(s.destination)}</p></div>
            <div class="doc-field"><h3>Place of Delivery</h3><p>${esc(s.currentLocation)}</p></div>
            <div class="doc-field"><h3>Vessel / Carrier</h3><p class="placeholder">[Vessel Name]</p></div>
          </div>

          <table class="doc-table">
            <thead>
              <tr>
                <th>Marks &amp; Numbers</th>
                <th>Description of Goods</th>
                <th>Gross Weight (kg)</th>
                <th>Measurement (CBM)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${esc(s.name)}</td>
                <td>Fresh Pomegranates</td>
                <td>${Number(s.amount).toLocaleString()}</td>
                <td class="placeholder">[CBM]</td>
              </tr>
            </tbody>
          </table>

          <div class="doc-section">
            <h3>Notify Party</h3>
            <p>${consigneeHtml}</p>
          </div>

          <div class="doc-section">
            <h3>Special Instructions / Handling</h3>
            <p class="placeholder">[e.g. Keep refrigerated at 2–4 °C. Handle with care.]</p>
          </div>

          <div class="doc-section" style="font-size:9pt; color:#555; line-height:1.65; margin-top:16px;">
            <p>Shipped on board in apparent good order and condition unless otherwise stated herein the total number or
            quantity of containers or other packages or units indicated above. IN WITNESS whereof the carrier or their
            agent has signed the number of Bills of Lading stated below, all of this tenor and date, one of which being
            accomplished the others to stand void.</p>
          </div>

          <div class="doc-footer">
            <div class="sig-box">
              <p>Carrier's Authorised Signature</p>
              <div class="sig-line"><span class="placeholder">[Carrier Name &amp; Stamp]</span></div>
            </div>
            <div class="sig-box">
              <p>Shipper's Signature &amp; Stamp</p>
              <div class="sig-line"><span class="placeholder">[Your Company Name]</span></div>
            </div>
          </div>
        </div>`;

      document.getElementById('doc-content').innerHTML = invoice + bl;
      document.getElementById('doc-overlay').classList.add('open');
      window.scrollTo(0, 0);
    }

    function closeDocOverlay() {
      document.getElementById('doc-overlay').classList.remove('open');
    }

    // ── THEME ──
    const html = document.documentElement;

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      const dark = theme === 'dark';
      document.getElementById('theme-icon').textContent  = dark ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';
      localStorage.setItem('pom_theme', theme);
    }

    document.getElementById('theme-btn').addEventListener('click', () => {
      applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    applyTheme(localStorage.getItem('pom_theme') || 'light');

    // ── INIT ──
    renderCards();
  </script>
</body>
</html>
